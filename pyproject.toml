[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sfx-change"
version = "0.1.0"
description = "Batch convert OGG audio files to WAV with ffmpeg"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
ogg2wav = "sfx_change.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
